<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Kur'an Hıfz Takibi</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-card: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --not-started: #475569;
        --not-started-hover: #64748b;
        --in-progress: #f59e0b;
        --in-progress-hover: #fbbf24;
        --memorized: #10b981;
        --memorized-hover: #34d399;
        --progress-bg: #334155;
        --shadow: rgba(0, 0, 0, 0.3);
        --locked-section: #1e1b2e;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        line-height: 1.5;
      }

      .app {
        max-width: 1200px;
        margin: 0 auto;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        background: var(--bg-secondary);
        padding: 0.6rem 1rem;
        border-bottom: 1px solid var(--bg-card);
        box-shadow: 0 4px 6px var(--shadow);
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 0.75rem;
        position: relative;
      }

      .title {
        font-size: 1.3rem;
        font-weight: 700;
        text-align: center;
        margin: 0 auto;
        background: linear-gradient(
          135deg,
          var(--memorized) 0%,
          var(--in-progress) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
      }

      .home-button {
        background: var(--bg-card);
        color: var(--text-primary);
        border: none;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        font-size: 1.2rem;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        flex-shrink: 0;
      }

      .progress-section {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-width: 500px;
        margin: 0 auto 0.75rem auto;
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .progress-label {
        font-size: 0.75rem;
        font-weight: 600;
        min-width: 85px;
        text-align: right;
      }

      .progress-label.in-progress {
        color: var(--in-progress);
      }
      .progress-label.memorized {
        color: var(--memorized);
      }

      .progress-bar-container {
        flex: 1;
        height: 8px;
        background: var(--progress-bg);
        border-radius: 4px;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        transition: width 0.4s ease;
      }

      .progress-bar.in-progress {
        background: var(--in-progress);
      }
      .progress-bar.memorized {
        background: var(--memorized);
      }

      .progress-count {
        font-size: 0.75rem;
        font-weight: 700;
        min-width: 85px;
        text-align: left;
      }

      .progress-count.in-progress {
        color: var(--in-progress);
      }
      .progress-count.memorized {
        color: var(--memorized);
      }

      .action-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 0.25rem;
        flex-wrap: wrap;
      }

      .filter-dropdown {
        position: relative;
      }

      .filter-trigger {
        background: var(--bg-card);
        color: var(--text-primary);
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 25px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filter-trigger:hover {
        background: var(--memorized);
      }

      .filter-menu {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        margin-top: 0.5rem;
        background: var(--bg-secondary);
        border-radius: 16px;
        overflow: hidden;
        display: none;
        flex-direction: column;
        min-width: 170px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        z-index: 200;
        border: 1px solid var(--bg-card);
      }

      .filter-menu.show {
        display: flex;
      }

      .filter-option {
        background: transparent;
        border: none;
        padding: 0.6rem 1rem;
        text-align: left;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filter-option:hover {
        background: var(--bg-card);
      }
      .filter-option.active-filter {
        background: var(--memorized);
        color: white;
      }
      .filter-option[data-filter="in-progress"] {
        color: var(--in-progress);
      }
      .filter-option[data-filter="memorized"] {
        color: var(--memorized);
      }
      .filter-option[data-filter="not-started"] {
        color: var(--not-started-hover);
      }
      .filter-option.active-filter {
        color: white;
      }

      .export-btn {
        background: var(--memorized);
        color: white;
        border: none;
        padding: 0.4rem 1rem;
        border-radius: 25px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        white-space: nowrap;
      }

      .export-btn:hover {
        background: var(--memorized-hover);
        transform: translateY(-2px);
      }

      .legend {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
        margin-top: 1rem;
        flex-wrap: wrap;
      }

      .legend-item {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 0.7rem;
        color: var(--text-secondary);
      }

      .legend-dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
      }

      .legend-dot.not-started {
        background: var(--not-started);
      }
      .legend-dot.in-progress {
        background: var(--in-progress);
      }
      .legend-dot.memorized {
        background: var(--memorized);
      }

      .main {
        flex: 1;
        padding: 0.75rem;
        overflow-y: auto;
      }

      /* ========== LOCKED SURAHS SECTION ========== */
      .locked-section {
        background: linear-gradient(135deg, #1e1b2e 0%, #1a1a2e 100%);
        border-radius: 16px;
        margin-bottom: 1rem;
        border: 1px solid rgba(16, 185, 129, 0.2);
        overflow: hidden;
      }

      .locked-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 1rem;
        background: rgba(16, 185, 129, 0.1);
        cursor: pointer;
      }

      .locked-title {
        font-weight: 700;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .locked-count {
        background: var(--memorized);
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 20px;
        font-size: 0.7rem;
      }

      .locked-toggle {
        font-size: 1rem;
        transition: transform 0.3s ease;
      }

      .locked-section.collapsed .locked-toggle {
        transform: rotate(-90deg);
      }

      .locked-content {
        max-height: 500px;
        overflow: hidden;
        transition: max-height 0.3s ease;
        padding: 0.75rem;
      }

      .locked-section.collapsed .locked-content {
        max-height: 0;
        padding: 0 0.75rem;
      }

      .locked-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      .locked-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: var(--bg-card);
        border-radius: 12px;
        padding: 0.6rem 0.75rem;
        gap: 0.5rem;
      }

      .locked-info {
        flex: 1;
      }

      .locked-surah-name {
        font-size: 0.8rem;
        font-weight: 600;
      }

      .locked-surah-detail {
        font-size: 0.6rem;
        color: var(--text-secondary);
      }

      .unlock-single-btn {
        background: #ef4444;
        border: none;
        color: white;
        padding: 0.3rem 0.7rem;
        border-radius: 20px;
        font-size: 0.65rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .unlock-single-btn:hover {
        background: #dc2626;
        transform: scale(1.02);
      }

      .empty-locked {
        text-align: center;
        padding: 1rem;
        color: var(--text-secondary);
        font-size: 0.75rem;
      }

      /* Regular sections */
      .section {
        margin-bottom: 0.75rem;
        border-radius: 14px;
        overflow: hidden;
        background: var(--bg-secondary);
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.6rem 0.75rem;
        background: var(--bg-card);
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .section-header:active {
        transform: scale(0.99);
      }
      .section-title {
        font-weight: 700;
        font-size: 0.85rem;
      }
      .section-stats {
        font-size: 0.7rem;
        color: var(--text-secondary);
      }
      .section-toggle {
        font-size: 1rem;
        transition: transform 0.3s ease;
      }
      .section.collapsed .section-toggle {
        transform: rotate(-90deg);
      }

      .section-content {
        display: grid;
        grid-template-rows: 1fr;
        transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .section.collapsed .section-content {
        grid-template-rows: 0fr;
      }

      .section-content-inner {
        overflow: hidden;
        padding: 0.5rem;
      }
      .section.collapsed .section-content-inner {
        padding: 0 0.5rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }

      @media (min-width: 480px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 768px) {
        .grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .main {
          padding: 1rem;
        }
        .locked-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }
      @media (min-width: 1024px) {
        .grid {
          grid-template-columns: repeat(5, 1fr);
        }
        .locked-grid {
          grid-template-columns: repeat(4, 1fr);
        }
      }

      .surah-card {
        position: relative;
        padding: 0.5rem 0.25rem;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        min-height: 65px;
        justify-content: center;
      }

      .surah-card:active {
        transform: scale(0.96);
      }
      .surah-card.status-0 {
        background: var(--not-started);
      }
      .surah-card.status-0:hover {
        background: var(--not-started-hover);
      }
      .surah-card.status-1 {
        background: var(--in-progress);
      }
      .surah-card.status-1:hover {
        background: var(--in-progress-hover);
      }
      .surah-card.status-2 {
        background: var(--memorized);
      }
      .surah-card.status-2:hover {
        background: var(--memorized-hover);
      }
      .surah-card.locked {
        cursor: pointer;
        opacity: 0.9;
      }

      .surah-number {
        font-size: 0.55rem;
        font-weight: 600;
        opacity: 0.7;
      }
      .surah-name {
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1.2;
      }
      .surah-verse {
        font-size: 0.5rem;
        opacity: 0.6;
        margin-top: 0.1rem;
      }
      .status-indicator {
        font-size: 0.55rem;
        margin-top: 0.15rem;
        opacity: 0.85;
      }
      .lock-icon {
        position: absolute;
        top: 3px;
        right: 5px;
        font-size: 0.6rem;
      }

      /* Modals */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.85);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .modal.show {
        display: flex;
      }

      .modal-content {
        background: var(--bg-secondary);
        padding: 2rem 1.5rem;
        border-radius: 28px;
        text-align: center;
        max-width: 320px;
        width: 100%;
        animation: slideUp 0.3s ease;
      }

      .modal-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      .modal-content h2 {
        font-size: 1.5rem;
        margin-bottom: 0.75rem;
      }
      .modal-content p {
        font-size: 1rem;
        margin-bottom: 1.5rem;
        color: var(--text-secondary);
      }

      .modal-close {
        background: var(--memorized);
        color: white;
        border: none;
        padding: 0.875rem 2rem;
        border-radius: 40px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
      }

      .status-modal-content {
        background: var(--bg-secondary);
        padding: 1.75rem;
        border-radius: 28px;
        max-width: 340px;
        width: 100%;
        animation: slideUp 0.3s ease;
      }

      .status-modal-header {
        text-align: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--bg-card);
      }

      .status-modal-surah-number {
        font-size: 0.85rem;
        color: var(--text-secondary);
        margin-bottom: 0.25rem;
      }

      .status-modal-surah-name {
        font-size: 1.5rem;
        font-weight: 700;
      }

      .status-options {
        display: flex;
        flex-direction: column;
        gap: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .status-option {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.25rem;
        border-radius: 16px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.2s ease;
      }

      .status-option:hover {
        transform: scale(1.02);
      }
      .status-option.selected {
        border-color: white;
      }

      .status-option.option-0 {
        background: var(--not-started);
      }
      .status-option.option-1 {
        background: var(--in-progress);
      }
      .status-option.option-2 {
        background: var(--memorized);
      }

      .status-option-dot {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .status-option.selected .status-option-dot::after {
        content: "✓";
        color: white;
        font-size: 14px;
      }

      .status-option-label {
        font-weight: 600;
        color: white;
        font-size: 1rem;
      }

      .status-modal-buttons {
        display: flex;
        gap: 1rem;
      }

      .status-modal-btn {
        flex: 1;
        padding: 0.875rem;
        border-radius: 40px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 0.95rem;
      }

      .status-modal-btn.cancel {
        background: var(--bg-card);
        color: var(--text-secondary);
      }

      .status-modal-btn.save {
        background: var(--memorized);
        color: white;
      }

      /* Unlock confirmation modal */
      .unlock-confirm-modal {
        background: var(--bg-secondary);
        padding: 1.75rem;
        border-radius: 28px;
        max-width: 320px;
        width: 100%;
        text-align: center;
        animation: slideUp 0.3s ease;
      }

      .unlock-confirm-modal h3 {
        font-size: 1.3rem;
        margin-bottom: 0.5rem;
      }

      .unlock-confirm-modal p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
      }

      .unlock-buttons {
        display: flex;
        gap: 1rem;
      }

      .unlock-buttons button {
        flex: 1;
        padding: 0.75rem;
        border-radius: 40px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-size: 0.95rem;
      }

      .confirm-unlock {
        background: #ef4444;
        color: white;
      }

      .cancel-unlock {
        background: var(--bg-card);
        color: var(--text-secondary);
      }

      @keyframes slideUp {
        from {
          transform: translateY(30px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .custom-toast {
        position: fixed;
        top: 70px;
        right: 16px;
        transform: translateX(20px);
        background: rgba(16, 185, 129, 0.95);
        backdrop-filter: blur(8px);
        color: white;
        padding: 10px 18px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: 600;
        z-index: 10000;
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        pointer-events: none;
        white-space: nowrap;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .custom-toast.show {
        opacity: 1;
        transform: translateX(0);
      }

      .save-indicator {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: rgba(16, 185, 129, 0.9);
        backdrop-filter: blur(8px);
        color: white;
        padding: 6px 14px;
        border-radius: 30px;
        font-size: 0.7rem;
        font-weight: bold;
        z-index: 9999;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      .no-results {
        text-align: center;
        padding: 1.5rem;
        color: var(--text-secondary);
        font-size: 0.8rem;
      }

      @media (max-width: 480px) {
        .section-title {
          font-size: 1rem !important;
        }
        .surah-name {
          font-size: 0.9rem !important;
          font-weight: 700;
        }
        .surah-number {
          font-size: 0.7rem !important;
        }
        .progress-label {
          font-size: 0.85rem !important;
          min-width: 95px;
        }
        .progress-count {
          font-size: 0.85rem !important;
        }
        .filter-trigger {
          font-size: 0.8rem !important;
        }
        .export-btn {
          font-size: 0.8rem !important;
        }
        .title {
          font-size: 1.2rem !important;
        }
        .custom-toast {
          top: 60px !important;
          right: 12px !important;
          font-size: 0.7rem !important;
          padding: 8px 14px !important;
        }
        .locked-grid {
          grid-template-columns: 1fr !important;
        }
        .locked-surah-name {
          font-size: 0.85rem;
        }
      }

      @media (max-width: 380px) {
        .custom-toast {
          white-space: normal !important;
          text-align: center;
          max-width: 85%;
          right: 50%;
          transform: translateX(50%) translateX(20px);
        }
        .custom-toast.show {
          transform: translateX(50%) translateX(0);
        }
        .export-btn span {
          display: none;
        }
        .export-btn {
          padding: 0.4rem 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-top">
          <h1 class="title">Kur'an Hıfzı</h1>
          <a href="../index.html" class="home-button" aria-label="Ana Sayfa"
            >🏠</a
          >
        </div>

        <div class="progress-section">
          <div class="progress-row">
            <span class="progress-label in-progress">Devam Ediyor</span>
            <div class="progress-bar-container">
              <div
                class="progress-bar in-progress"
                id="progress-bar-inprogress"
              ></div>
            </div>
            <span class="progress-count in-progress" id="count-inprogress"
              >0 / 114</span
            >
          </div>
          <div class="progress-row">
            <span class="progress-label memorized">Tamamlanan</span>
            <div class="progress-bar-container">
              <div
                class="progress-bar memorized"
                id="progress-bar-memorized"
              ></div>
            </div>
            <span class="progress-count memorized" id="count-memorized"
              >114 kaldi</span
            >
          </div>
        </div>

        <div class="action-bar">
          <div class="filter-dropdown">
            <button class="filter-trigger" id="filter-trigger">
              <span id="filter-label">📊 Tümü (114)</span>
              <span class="dropdown-arrow">▼</span>
            </button>
            <div class="filter-menu" id="filter-menu">
              <button class="filter-option active-filter" data-filter="all">
                📊 Tümü (114)
              </button>
              <button class="filter-option" data-filter="in-progress">
                🔄 Devam Ediyor
              </button>
              <button class="filter-option" data-filter="memorized">
                ✅ Tamamlanan
              </button>
              <button class="filter-option" data-filter="not-started">
                ⏳ Başlanmayan
              </button>
            </div>
          </div>
          <button class="export-btn" id="export-btn">
            📥 <span>Yedek Al (Düzenli)</span>
          </button>
        </div>
      </header>

      <main class="main">
        <div class="legend">
          <div class="legend-item">
            <span class="legend-dot not-started"></span><span>Baslanmadi</span>

      function getVerseGroup(verses) {
        if (verses <= 10) return { name: "1-10 Ayetli Sureler", order: 1 };
        if (verses <= 50) return { name: "11-50 Ayetli Sureler", order: 2 };
        if (verses <= 100) return { name: "51-100 Ayetli Sureler", order: 3 };
        if (verses <= 200) return { name: "101-200 Ayetli Sureler", order: 4 };
        return { name: "201+ Ayetli Sureler", order: 5 };
      }

      const STATUS_LABELS = {
        0: "Baslanmadi",
        1: "Devam Ediyor",
        2: "Tamamlandi",
      };
      const STORAGE_KEY = "quran_memorization_state";
      const LAST_SAVE_KEY = "quran_last_save";

      let surahStates = {};
      let currentSurahId = null;
      let selectedStatus = null;
      let currentFilter = "all";
      let pendingUnlockId = null;

      function initializeState() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            surahStates = JSON.parse(saved);
            SURAHS.forEach((s) => {
              if (surahStates[s.id] === undefined) surahStates[s.id] = 0;
            });
          } catch (e) {
            initializeDefaultState();
          }
        } else {
          initializeDefaultState();
        }
        saveState();
      }

      function initializeDefaultState() {
        surahStates = {};
        SURAHS.forEach((s) => {
          surahStates[s.id] = 0;
        });
      }

      function saveState() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(surahStates));
        localStorage.setItem(LAST_SAVE_KEY, new Date().toISOString());
        showSaveIndicator();
      }

      function showSaveIndicator() {
        let indicator = document.getElementById("save-indicator");
        if (!indicator) {
          indicator = document.createElement("div");
          indicator.id = "save-indicator";
          indicator.className = "save-indicator";
          document.body.appendChild(indicator);
        }
        const lastSave = localStorage.getItem(LAST_SAVE_KEY);
        if (lastSave) {
          const date = new Date(lastSave);
          indicator.textContent = `💾 Kaydedildi: ${date.toLocaleTimeString()}`;
        } else {
          indicator.textContent = `💾 Kaydedildi: Şimdi`;
        }
        indicator.style.opacity = "1";
        setTimeout(() => {
          indicator.style.opacity = "0";
        }, 2000);
      }

      function showToast(message, bgColor = "#10b981") {
        let toast = document.getElementById("custom-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "custom-toast";
          toast.className = "custom-toast";
          document.body.appendChild(toast);
        }
        toast.style.backgroundColor = bgColor;
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => {
          toast.classList.remove("show");
        }, 2500);
      }

      function exportData() {
        const memorized = [];
        const inProgress = [];
        const notStarted = [];

        SURAHS.forEach((surah) => {
          const status = surahStates[surah.id];
          const surahInfo = `${surah.name} (${surah.verses} ayet)`;
          if (status === 2) memorized.push(surahInfo);
          else if (status === 1) inProgress.push(surahInfo);
          else notStarted.push(surahInfo);
        });

        const totalMemorized = memorized.length;
        const totalInProgress = inProgress.length;
        const totalNotStarted = notStarted.length;
        const completionPercentage = Math.round((totalMemorized / 114) * 100);
        const exportDate = new Date();
        const formattedDate = exportDate.toLocaleDateString("tr-TR");
        const formattedTime = exportDate.toLocaleTimeString("tr-TR");

        function createNumberedList(items, startNumber = 1) {
          if (items.length === 0) return `  (Henüz kayıt yok)\n`;
          let result = "";
          items.forEach((item, index) => {
            result += `  ${startNumber + index}. ${item}\n`;
          });
          const lastNumber = startNumber + items.length - 1;
          result += `\n  Toplam: ${lastNumber} (N${lastNumber}) sure\n`;
          return result;
        }

        let exportText = `╔══════════════════════════════════════════════════════════════╗\n`;
        exportText += `║              📖 KUR'AN HIFZ TAKIBI - YEDEK RAPORU              ║\n`;
        exportText += `╚══════════════════════════════════════════════════════════════╝\n\n`;
        exportText += `📅 Tarih: ${formattedDate}\n⏰ Saat: ${formattedTime}\n📊 Genel Durum: ${completionPercentage}% Tamamlandı\n`;
        exportText += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
        exportText += `✅ TAMAMLANAN SURELER (${totalMemorized}/114)\n────────────────────────────────────────────────────────────────\n${createNumberedList(memorized, 1)}\n`;
        exportText += `🔄 DEVAM EDİYOR (${totalInProgress})\n────────────────────────────────────────────────────────────────\n${createNumberedList(inProgress, 1)}\n`;
        exportText += `⏳ BAŞLANMAYAN (${totalNotStarted})\n────────────────────────────────────────────────────────────────\n${createNumberedList(notStarted, 1)}\n`;
        exportText += `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📈 ÖZET İSTATİSTİKLER\n────────────────────────────────────────────────────────────────\n`;
        exportText += `  ✅ Tamamlanan:   ${totalMemorized}/114 (${Math.round((totalMemorized / 114) * 100)}%)\n  🔄 Devam Eden:   ${totalInProgress}\n  ⏳ Kalan:        ${totalNotStarted}\n\n`;
        exportText += `  🎯 Hedef: 114 sure\n  📈 İlerleme: ${"█".repeat(Math.floor(completionPercentage / 2))}${"░".repeat(50 - Math.floor(completionPercentage / 2))}\n\n`;
        exportText += `╔══════════════════════════════════════════════════════════════╗\n║  🤲 Allah kabul etsin. Ezberleriniz daim olsun!              ║\n╚══════════════════════════════════════════════════════════════╝\n`;

        const textBlob = new Blob([exportText], {
          type: "text/plain;charset=utf-8",
        });
        const textUrl = URL.createObjectURL(textBlob);
        const a = document.createElement("a");
        a.href = textUrl;
        a.download = `hifz_raporu_${exportDate.toISOString().split("T")[0]}.txt`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(textUrl), 100);
        showToast(
          `✅ Yedek alındı! ${totalMemorized}/114 sure tamamlandı`,
          "#10b981",
        );
      }

      function calculateProgress() {
        const values = Object.values(surahStates);
        const inProgressCount = values.filter((s) => s === 1).length;
        const memorizedCount = values.filter((s) => s === 2).length;
        return {
          inProgressCount,
          memorizedCount,
          remaining: 114 - memorizedCount,
          inProgressPercentage: (inProgressCount / 114) * 100,
          memorizedPercentage: (memorizedCount / 114) * 100,
        };
      }

      function updateProgress() {
        const {
          inProgressCount,
          memorizedCount,
          remaining,
          inProgressPercentage,
          memorizedPercentage,
        } = calculateProgress();
        document.getElementById("count-inprogress").textContent =
          `${inProgressCount} / 114`;
        if (memorizedCount === 0)
          document.getElementById("count-memorized").textContent = `114 kaldi`;
        else if (remaining === 0)
          document.getElementById("count-memorized").textContent =
            `Tamamlandi!`;
        else
          document.getElementById("count-memorized").textContent =
            `${remaining} kaldi`;
        document.getElementById("progress-bar-inprogress").style.width =
          `${inProgressPercentage}%`;
        document.getElementById("progress-bar-memorized").style.width =
          `${memorizedPercentage}%`;
      }

      function renderLockedSection() {
        const lockedSurahs = SURAHS.filter((s) => surahStates[s.id] === 2);
        const lockedCount = lockedSurahs.length;
        const lockedCountEl = document.getElementById("locked-count");
        const lockedListEl = document.getElementById("locked-list");

        if (lockedCountEl) lockedCountEl.textContent = lockedCount;

        if (!lockedListEl) return;

        if (lockedSurahs.length === 0) {
          lockedListEl.innerHTML =
            '<div class="empty-locked">✅ Hiç kilitli sure yok. Tebrikler!</div>';
          return;
        }

        lockedListEl.innerHTML = "";
        lockedSurahs.forEach((surah) => {
          const card = document.createElement("div");
          card.className = "locked-card";
          card.innerHTML = `
            <div class="locked-info">
              <div class="locked-surah-name">${surah.name}</div>
              <div class="locked-surah-detail">Sure ${surah.id} • ${surah.verses} ayet</div>
            </div>
            <button class="unlock-single-btn" data-id="${surah.id}">🔓 Çöz</button>
          `;
          lockedListEl.appendChild(card);
        });

        document.querySelectorAll(".unlock-single-btn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const surahId = parseInt(btn.dataset.id);
            const surah = SURAHS.find((s) => s.id === surahId);
            pendingUnlockId = surahId;
            document.getElementById("unlock-surah-name").textContent =
              `${surah.name} (Sure ${surah.id}) suresini çözmek istiyor musunuz?`;
            document
              .getElementById("unlock-confirm-modal")
              .classList.add("show");
          });
        });
      }

      function performUnlock() {
        if (pendingUnlockId !== null) {
          const surah = SURAHS.find((s) => s.id === pendingUnlockId);
          surahStates[pendingUnlockId] = 0;
          saveState();
          renderSections();
          renderLockedSection();
          updateProgress();
          showToast(
            `🔓 ${surah.name} çözüldü. Tekrar ezberlemeye başlayabilirsiniz!`,
            "#f59e0b",
          );
          pendingUnlockId = null;
        }
        document
          .getElementById("unlock-confirm-modal")
          .classList.remove("show");
      }

      function cancelUnlock() {
        pendingUnlockId = null;
        document
          .getElementById("unlock-confirm-modal")
          .classList.remove("show");
      }

      function renderSections() {
        const container = document.getElementById("sections-container");
        if (!container) return;
        container.innerHTML = "";

        const groups = {};
        SURAHS.forEach((surah) => {
          const group = getVerseGroup(surah.verses);
          if (!groups[group.name])
            groups[group.name] = { ...group, surahs: [] };
          groups[group.name].surahs.push(surah);
        });

        const sortedGroups = Object.values(groups).sort(
          (a, b) => a.order - b.order,
        );

        sortedGroups.forEach((group) => {
          let filteredSurahs = group.surahs;
          if (currentFilter === "in-progress")
            filteredSurahs = group.surahs.filter(
              (s) => surahStates[s.id] === 1,
            );
          else if (currentFilter === "memorized")
            filteredSurahs = group.surahs.filter(
              (s) => surahStates[s.id] === 2,
            );
          else if (currentFilter === "not-started")
            filteredSurahs = group.surahs.filter(
              (s) => surahStates[s.id] === 0,
            );

          if (filteredSurahs.length === 0) return;

          const stats = {
            total: group.surahs.length,
            memorized: group.surahs.filter((s) => surahStates[s.id] === 2)
              .length,
            inProgress: group.surahs.filter((s) => surahStates[s.id] === 1)
              .length,
          };

          const section = document.createElement("div");
          section.className = "section";
          section.innerHTML = `
            <div class="section-header">
              <span class="section-title">📖 ${group.name}</span>
              <div style="display: flex; gap: 0.4rem; align-items: center;">
                <span class="section-stats">✅ ${stats.memorized}/${stats.total} | 🔄 ${stats.inProgress}</span>
                <span class="section-toggle">▼</span>
              </div>
            </div>
            <div class="section-content">
              <div class="section-content-inner">
                <div class="grid" data-group="${group.name}"></div>
              </div>
            </div>
          `;

          const grid = section.querySelector(".grid");
          filteredSurahs.forEach((surah) => {
            const status = surahStates[surah.id];
            const isLocked = status === 2;
            const card = document.createElement("div");
            card.className = `surah-card status-${status}${isLocked ? " locked" : ""}`;
            card.dataset.surahId = surah.id;
            card.innerHTML = `
              <div class="surah-number">${surah.id}</div>
              <div class="surah-name">${surah.name}</div>
              <div class="surah-verse">${surah.verses} ayet</div>
              <div class="status-indicator">${STATUS_LABELS[status]}</div>
              ${isLocked ? '<span class="lock-icon">🔒</span>' : ""}
            `;
            card.addEventListener("click", (e) => {
              e.stopPropagation();
              if (status === 2) {
                pendingUnlockId = surah.id;
                document.getElementById("unlock-surah-name").textContent =
                  `${surah.name} (Sure ${surah.id}) suresini çözmek istiyor musunuz?`;
                document
                  .getElementById("unlock-confirm-modal")
                  .classList.add("show");
              } else {
                openStatusModal(surah.id);
              }
            });
            grid.appendChild(card);
          });

          const header = section.querySelector(".section-header");
          header.addEventListener("click", () => {
            section.classList.toggle("collapsed");
          });
          container.appendChild(section);
        });

        if (container.children.length === 0) {
          container.innerHTML =
            '<div class="no-results">⚠️ Bu filtreye uygun sure bulunamadı</div>';
        }

        renderLockedSection();
      }

      function openStatusModal(surahId) {
        currentSurahId = surahId;
        const surah = SURAHS.find((s) => s.id === surahId);
        document.getElementById("status-modal-number").textContent =
          `Sure ${surah.id} (${surah.verses} ayet)`;
        document.getElementById("status-modal-name").textContent = surah.name;
        selectedStatus = surahStates[surahId];
        updateStatusOptions();
        document.getElementById("status-modal").classList.add("show");
      }

      function updateStatusOptions() {
        document.querySelectorAll(".status-option").forEach((option) => {
          const status = parseInt(option.dataset.status);
          option.classList.toggle("selected", status === selectedStatus);
        });
      }

      function closeStatusModal() {
        document.getElementById("status-modal").classList.remove("show");
        currentSurahId = null;
        selectedStatus = null;
      }

      function saveSelectedStatus() {
        if (currentSurahId !== null && selectedStatus !== null) {
          const surah = SURAHS.find((s) => s.id === currentSurahId);
          surahStates[currentSurahId] = selectedStatus;
          saveState();
          renderSections();
          updateProgress();
          checkCompletion();
          showToast(
            `📖 ${surah.name}: ${STATUS_LABELS[selectedStatus]}`,
            "#10b981",
          );
        }
        closeStatusModal();
      }

      function checkCompletion() {
        const { memorizedCount } = calculateProgress();
        if (memorizedCount === 114)
          document.getElementById("completion-modal").classList.add("show");
      }

      function hideCompletionModal() {
        document.getElementById("completion-modal").classList.remove("show");
      }

      function initDropdown() {
        const trigger = document.getElementById("filter-trigger");
        const menu = document.getElementById("filter-menu");
        const filterLabel = document.getElementById("filter-label");

        if (trigger && menu) {
          trigger.addEventListener("click", (e) => {
            e.stopPropagation();
            menu.classList.toggle("show");
          });

          document.addEventListener("click", (e) => {
            if (!trigger.contains(e.target) && !menu.contains(e.target)) {
              menu.classList.remove("show");
            }
          });

          document.querySelectorAll(".filter-option").forEach((option) => {
            option.addEventListener("click", () => {
              const filter = option.dataset.filter;
              filterLabel.innerHTML = option.innerHTML;
              menu.classList.remove("show");
              document
                .querySelectorAll(".filter-option")
                .forEach((opt) => opt.classList.remove("active-filter"));
              option.classList.add("active-filter");
              currentFilter = filter;
              renderSections();
            });
          });
        }
      }

      function initLockedSectionToggle() {
        const header = document.getElementById("locked-header");
        const section = document.getElementById("locked-section");
        if (header && section) {
          header.addEventListener("click", () => {
            section.classList.toggle("collapsed");
          });
        }
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => console.log("✅ SW registered:", reg.scope))
            .catch((err) => console.log("❌ SW failed:", err));
        });
      }

      function init() {
        initializeState();
        renderSections();
        updateProgress();
        initDropdown();
        initLockedSectionToggle();

        document
          .getElementById("export-btn")
          ?.addEventListener("click", exportData);
        document
          .getElementById("modal-close")
          ?.addEventListener("click", hideCompletionModal);
        document
          .getElementById("completion-modal")
          ?.addEventListener("click", (e) => {
            if (e.target.id === "completion-modal") hideCompletionModal();
          });

        document.querySelectorAll(".status-option").forEach((option) => {
          option.addEventListener("click", () => {
            selectedStatus = parseInt(option.dataset.status);
            updateStatusOptions();
          });
        });

        document
          .getElementById("status-cancel")
          ?.addEventListener("click", closeStatusModal);
        document
          .getElementById("status-save")
          ?.addEventListener("click", saveSelectedStatus);
        document
          .getElementById("status-modal")
          ?.addEventListener("click", (e) => {
            if (e.target.id === "status-modal") closeStatusModal();
          });

        document
          .getElementById("confirm-unlock")
          ?.addEventListener("click", performUnlock);
        document
          .getElementById("cancel-unlock")
          ?.addEventListener("click", cancelUnlock);
        document
          .getElementById("unlock-confirm-modal")
          ?.addEventListener("click", (e) => {
            if (e.target.id === "unlock-confirm-modal") cancelUnlock();
          });
      }

      document.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
